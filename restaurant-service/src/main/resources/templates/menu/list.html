<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Menu')}"></head>
<body>
<nav th:replace="~{fragments :: nav('menu')}"></nav>
<main class="container">
    <div class="page-header">
        <h1>Menu</h1>
        <a th:href="@{/menu/new}" class="btn">+ Add item</a>
    </div>
    <div th:replace="~{fragments :: flash}"></div>

    <form class="filters" th:action="@{/menu}" method="get">
        <input type="text" name="q" placeholder="Search by name" th:value="${q}">
        <button class="btn btn-secondary" type="submit">Search</button>
    </form>
    <form class="filters" th:action="@{/menu}" method="get">
        <input type="number" name="maxPrice" min="1" placeholder="Max price ₹" th:value="${maxPrice}">
        <button class="btn btn-secondary" type="submit">Under price</button>
        <a th:href="@{/menu(veg=true)}" class="btn btn-secondary">🟢 Vegetarian only</a>
        <a th:href="@{/menu}" class="btn btn-link">Clear</a>
    </form>

    <div class="card">
        <table>
            <thead>
            <tr><th>ID</th><th>Name</th><th>Type</th><th>Category</th><th>Details</th><th>Price</th><th>Available</th><th></th></tr>
            </thead>
            <tbody>
            <tr th:each="item : ${items}">
                <td th:text="${item.id}">1</td>
                <td><strong th:text="${item.name}">Name</strong><br><small class="muted" th:text="${item.description}"></small></td>
                <td><span class="badge" th:classappend="${#strings.toLowerCase(item.itemType)}" th:text="${item.itemType}">FOOD</span></td>
                <td th:text="${item.category}">Category</td>
                <td>
                    <th:block th:if="${item.itemType == 'FOOD'}">
                        <span th:text="${item.vegetarian} ? '🟢 Veg' : '🔴 Non-veg'"></span> &middot;
                        <span th:text="${item.spiceLevel}"></span>
                    </th:block>
                    <th:block th:if="${item.itemType == 'BEVERAGE'}">
                        <span th:text="${item.volumeMl} + ' ml'"></span> &middot;
                        <span th:text="${item.servedCold} ? 'Cold' : 'Hot'"></span>
                    </th:block>
                </td>
                <td th:text="'₹' + ${#numbers.formatDecimal(item.price, 1, 2)}">₹0</td>
                <td th:text="${item.available} ? 'Yes' : 'No'">Yes</td>
                <td class="actions">
                    <a th:href="@{/menu/{id}/edit(id=${item.id})}" class="btn btn-small btn-secondary">Edit</a>
                    <form th:action="@{/menu/{id}/delete(id=${item.id})}" method="post"
                          onsubmit="return confirm('Delete this item?')">
                        <button class="btn btn-small btn-danger" type="submit">Delete</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(items)}"><td colspan="8" class="muted">No menu items found</td></tr>
            </tbody>
        </table>
    </div>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
