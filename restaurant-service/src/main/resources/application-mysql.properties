# ---------- MySQL ----------
# The database is created automatically (createDatabaseIfNotExist=true)
# Username/password can be overridden with the environment variables DB_USERNAME / DB_PASSWORD
spring.datasource.url=jdbc:mysql://localhost:3306/restaurant_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
