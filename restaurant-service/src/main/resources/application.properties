# ============================================================
#  Restaurant Service (main application) - runs on port 8080
# ============================================================
spring.application.name=restaurant-service
server.port=8080

# Which database to use: postgres | mysql | h2
# (override on the command line: ./mvnw spring-boot:run -Dspring-boot.run.profiles=mysql)
spring.profiles.active=postgres

# ---------- JPA / Hibernate ----------
# update = Hibernate creates/updates the tables from the @Entity classes
spring.jpa.hibernate.ddl-auto=update
# print the SQL that Hibernate generates (useful for the demo/viva)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# ---------- JSON ----------
# allow a JSON body to leave out boolean fields (e.g. "available") - they get their default value
spring.jackson.deserialization.fail-on-null-for-primitives=false

# ---------- Billing microservice (second Spring Boot app) ----------
billing.service.url=http://localhost:8082

# ---------- Actuator ----------
management.endpoints.web.exposure.include=health,info,beans
