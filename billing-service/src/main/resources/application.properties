# ============================================================
#  Billing Service (independent microservice) - runs on port 8082
# ============================================================
spring.application.name=billing-service
server.port=8082

# Tax and charges used when calculating a bill
billing.gst-percent=5.0
billing.service-charge-percent=10.0
# orders above this amount get a discount
billing.discount-threshold=1000.0
billing.discount-percent=10.0

management.endpoints.web.exposure.include=health,info
